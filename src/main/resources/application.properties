spring.application.name=hookrelay
management.endpoints.web.exposure.include=health
hookrelay.delivery.target-url=${WEBHOOK_TARGET_URL:http://localhost:9000/webhook}
hookrelay.delivery.worker-enabled=${DELIVERY_WORKER_ENABLED:true}
hookrelay.delivery.poll-interval-ms=${DELIVERY_POLL_INTERVAL_MS:1000}
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=10s
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hookrelay}
spring.datasource.username=${DB_USER:hookrelay}
spring.datasource.password=${DB_PASSWORD}
